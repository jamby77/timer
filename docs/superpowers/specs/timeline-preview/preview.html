<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complex setup · Timeline design</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font:16px/1.4 system-ui,sans-serif}main{max-width:460px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 16px}article{background:#101827;border:1px solid #293548;border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 12px}button,summary{cursor:pointer;color:inherit;font:inherit}nav{display:flex;background:#020617;border-radius:8px;padding:3px;margin-bottom:16px}button{flex:1;min-height:44px;border:0;border-radius:6px;background:none;color:#a5b4c8}button[aria-pressed=true]{background:#28354a;color:#fff;font-weight:600}.row,summary,.split{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:baseline}.row,summary{padding:12px 0;border-top:1px solid #334155}time{font-variant-numeric:tabular-nums;color:#b9c8dc}.details,.sub,small{color:#aebbd0;font-size:14px}.sub{grid-column:2/-1}summary{list-style:none;min-height:44px}summary::-webkit-details-marker{display:none}summary::after{content:'⌄';grid-column:3;grid-row:1}details[open] summary::after{content:'⌃'}.split{padding:3px 0;font-size:14px}.round{font-size:13px;color:#b6c8e6;margin:8px 0 2px;font-weight:600}.splits{border-left:2px solid #42577a;padding:0 0 8px 12px;margin:0 0 12px 4px}.total{font-weight:650}small{display:block}
</style>
<main><h1>Complex setup</h1><article><h2>Phase Summary</h2>
<nav aria-label="Phase views"><button aria-pressed="false">Summary</button><button aria-pressed="true">Preview</button></nav>
<section hidden><p><b>1　Warmup</b><small>Countdown · 1m</small></p><p><b>2　Intervals</b><small>3 rounds · Final rest skipped<br>30s work / 10s rest</small></p><p><b>3　Cooldown</b><small>Countdown · 1m</small></p></section>
<section><div class="row"><time>0:00</time><b>Warmup</b><small>1m</small></div>
<details><summary><time>1:00</time><b>Intervals</b><span class="sub">3 rounds · 1m 50s</span></summary><div class="splits">
<div class="round">Round 1</div><div class="split"><time>1:00</time>Work<small>30s</small></div><div class="split"><time>1:30</time>Rest<small>10s</small></div>
<div class="round">Round 2</div><div class="split"><time>1:40</time>Work<small>30s</small></div><div class="split"><time>2:10</time>Rest<small>10s</small></div>
<div class="round">Round 3</div><div class="split"><time>2:20</time>Work<small>30s</small></div></div></details>
<div class="row"><time>2:50</time><b>Cooldown</b><small>1m</small></div><div class="row total"><time>3:50</time>Finish</div></section></article></main>
<script>
const buttons = Array.from(document.querySelectorAll('button'));
buttons.forEach((button, index) => button.onclick = () => {
  buttons.forEach((item, i) => item.setAttribute('aria-pressed', String(index === i)));
  document.querySelectorAll('section').forEach((section, i) => section.hidden = index !== i);
});
</script>
</html>
