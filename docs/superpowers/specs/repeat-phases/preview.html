<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repeat phases · Design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font:16px/1.4 system-ui,sans-serif}main{max-width:440px;margin:auto;padding:18px 14px}h1{font-size:20px;margin:0 0 18px}section{background:#101828;border:1px solid #334155;border-radius:10px;padding:14px}header,.phase,footer,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.phase{padding:12px 0;border-bottom:1px solid #28364c}small,label,footer{color:#bac7da}button,select,input{min-height:44px;font:inherit;color:inherit;border-radius:7px;border:1px solid #40506a;background:#172439;padding:0 12px}button{cursor:pointer}header{margin-bottom:6px}header strong{font-size:19px}footer{margin-top:16px}footer b{color:white}.group{border-left:3px solid #7999e4;padding-left:12px;margin:6px 0 16px}.actions{margin-top:18px}.primary{background:#dce8ff;color:#142544;border-color:#dce8ff}label{display:block;font-size:14px;margin:12px 0 4px}select,input{width:100%;min-width:0;color-scheme:dark}h2{margin:0;font-size:18px}
</style><main><h1>Timer phases</h1><section id="card"></section></main>
<script>
const names = ['Row', 'Rest', 'Bike', 'Rest', 'Cooldown'];
const seconds = [45, 15, 45, 15, 60];
const card = document.querySelector('#card');
let group;
function duration(n) {
  return [Math.floor(n / 60) ? Math.floor(n / 60) + 'm' : '', n % 60 ? n % 60 + 's' : ''].filter(Boolean).join(' ');
}
function show() {
  let rows = group ? '' : '<header><strong>5 phases</strong><button id="repeat">Repeat</button></header>';
  let total = 0;
  names.forEach((name, i) => {
    if (group && i === group.first) rows += '<header><strong>Repeat ×' + group.count + '</strong><button id="repeat">Edit</button></header><div class="group">';
    rows += '<div class="phase"><span>' + name + '</span><small>' + duration(seconds[i]) + '</small></div>';
    if (group && i === group.last) rows += '</div>';
    total += seconds[i] * (group && i >= group.first && i <= group.last ? group.count : 1);
  });
  card.innerHTML = rows + '<footer>Total<b>' + duration(total) + '</b></footer>';
  card.querySelector('#repeat').onclick = edit;
}
function edit() {
  const draft = group || {first: 0, last: 0, count: 2};
  const options = selected => names.map((name, i) =>
    '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + (i + 1) + ' · ' + name + '</option>'
  ).join('');
  card.innerHTML = '<form><h2>Repeat phases</h2><label for="first">From</label><select id="first">' + options(draft.first) +
    '</select><label for="last">Through</label><select id="last">' + options(draft.last) +
    '</select><label for="count">Times</label><input id="count" type="number" inputmode="numeric" min="2" max="100" required value="' +
    draft.count + '"><div class="actions"><button id="cancel" type="button">Cancel</button><button class="primary">Apply</button></div></form>';
  const first = card.querySelector('#first'), last = card.querySelector('#last');
  function limit() {
    for (const option of last.options) option.disabled = Number(option.value) < Number(first.value);
    if (Number(last.value) < Number(first.value)) last.value = first.value;
  }
  first.onchange = limit;
  limit();
  card.querySelector('#cancel').onclick = show;
  card.querySelector('form').onsubmit = event => {
    event.preventDefault();
    group = {first: Number(first.value), last: Number(last.value), count: Number(card.querySelector('#count').value)};
    show();
  };
}
show();
</script></html>
